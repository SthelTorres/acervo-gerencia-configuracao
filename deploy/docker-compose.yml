# =====================================================================
# Topologia de execução do Acervo (aplicação + PostgreSQL).
# Mesma definição para HOMOLOGAÇÃO e PRODUÇÃO; o que muda entre os
# ambientes fica em deploy/env/<ambiente>.env (configuração externalizada).
# Não use diretamente: execute deploy/deploy.sh <ambiente> <versao>.
# =====================================================================
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acervo
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: ${ACERVO_DB_SENHA:?defina ACERVO_DB_SENHA}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acervo -d acervo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m

  app:
    image: ${ACERVO_IMAGEM:-localhost:5050/acervo}:${ACERVO_VERSAO:?defina ACERVO_VERSAO}
    depends_on:
      banco:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/acervo
      SPRING_DATASOURCE_USERNAME: acervo
      SPRING_DATASOURCE_PASSWORD: ${ACERVO_DB_SENHA}
      ACERVO_AMBIENTE: ${ACERVO_AMBIENTE:-desconhecido}
    ports:
      - "${ACERVO_PORTA:-8080}:8080"
    restart: unless-stopped
    mem_limit: 768m

volumes:
  dados:
